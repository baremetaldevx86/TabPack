# Reduced heterogeneous TabPack on Churn: method "tabpack"
# (tabpack_repro.config.TabPackConfig).
#
# Samples one hyperparameter config per member from `space`, trains all n_models
# members as one pack with Muon+AdamW, and keeps a greedy online ensemble chosen on
# validation during training. The final prediction is that online ensemble. Reduced
# versus the official Churn run: n_models 32 (official 64) and max_ensemble_size 16
# (official 32); everything else follows the official config
# (experiments/tabpack/churn/main/config.json). See docs/EXPERIMENT.md, sections
# 3.1, 3.4 and 4.
#
# Every value below equals the dataclass default in src/tabpack_repro/config.py,
# the source of truth; tests/test_config.py checks that they agree. Omitted keys
# take their defaults, unknown keys are an error. TOML has no null: the string
# "none" means None in the optional string settings (the three *_policy keys and
# training.amp_dtype).
#
# Run (docs/EXPERIMENT.md, section 8):
#   uv run python -m tabpack_repro run --config configs/churn/tabpack.toml \
#     --seed 0 --output runs/churn/tabpack/seed-0

method = "tabpack"
# Run seed: config sampling (optuna RandomSampler(seed)), initialization, dropout
# masks and batch order. `--seed` overrides it.
seed = 0
# Number of sampled member configs trained in the pack (official Churn: 64).
n_models = 32
# Width of every block of every member (not sampled).
d_block = 384
# "ReLU", "GELU" or "SiLU" (not sampled).
activation = "ReLU"

# Explicit member configs, optional (default: none, so configs are sampled from
# `space`). When given as [[configs]] tables, `space` is ignored and n_models must
# equal the number of tables. The conservative protocol (tabpack-conservative.toml)
# uses this to retrain selected configs; each entry has the shape of one sample:
#
#   [[configs]]
#   [configs.model]
#   n_blocks = 2
#   dropout = 0.0
#   [configs.optimizer]
#   lr = 0.001
#   weight_decay = 0.01
#   muon_lr = 0.02

# Data and preprocessing, identical for all methods (docs/EXPERIMENT.md, section 2).
[data]
# Dataset directory. A relative path is resolved against the data directory
# ($TABPACK_DATA_DIR, by default data/), so "churn" means data/churn.
path = "churn"
# Seed of the noisy-quantile transform. Always 0, independent of the run seed, as
# in the official code, so every run sees the same preprocessed data.
seed = 0
# Numerical features: QuantileTransformer to a normal distribution, fitted on the
# train part plus N(0, 1e-5) noise.
num_policy = "noisy-quantile"
# Move numerical columns with exactly two unique values to the binary features
# (changes nothing on Churn).
extract_bin_from_num = true
# Binary features are converted to categorical ones.
bin_policy = "convert-to-cat"
# Categorical features are ordinal-encoded (the model then one-hot encodes them).
cat_policy = "ordinal"

# MuonAdamWPack: Muon for the backbone block weights, AdamW for the head weight and
# all biases. These settings are fixed; lr, weight_decay and muon_lr are sampled
# per member (see [space.optimizer]).
[optimizer]
# AdamW betas and eps.
beta1 = 0.9
beta2 = 0.999
eps = 1e-08
# Muon momentum, Nesterov momentum on/off and Newton-Schulz iterations.
muon_momentum = 0.95
muon_nesterov = true
muon_ns_steps = 5
# One step counter shared by all members (official: true).
shared_step = true

# Training loop, identical for all methods (docs/EXPERIMENT.md, section 3.1).
[training]
# 256 gives 25 steps per epoch on Churn's 6,400 training rows.
batch_size = 256
# Early stopping per member on val accuracy: a member stops after patience + 1 = 17
# consecutive epochs without a strict improvement, moves to the finished pool at
# its best epoch and leaves the pack.
patience = 16
# -1 means no epoch limit: early stopping and the online ensemble end training.
max_epochs = -1
# Batch size for evaluation; 32768 evaluates each whole part in one batch.
eval_batch_size = 32768
# Autocast dtype on CUDA: "bfloat16", "float16" or "none" (float32). CPU runs are
# always float32.
amp_dtype = "bfloat16"
# "auto" picks CUDA when available, else the CPU; or e.g. "cpu", "cuda:0".
# `--device` overrides it.
device = "auto"

# Greedy online ensemble, updated after every epoch (docs/EXPERIMENT.md, 3.4).
[online_ensemble]
# Greedy forward selection (Caruana et al., 2004) on val probabilities.
type = "greedy"
# Running members enter the pool with their latest epoch's predictions.
update_type = "latest"
# The current ensemble's entries stay in the selection pool.
include_current_ensemble_in_pool = true
# The run ends after patience + 1 = 33 consecutive updates without a strict val
# improvement of the ensemble (or when no member is running).
patience = 32
# At most this many entries (official Churn: 32).
max_ensemble_size = 16

# Search space, identical to the official Churn space, in the official "_tune_"
# format (see src/tabpack_repro/sampler.py):
#   ["_tune_", "int", low, high]          uniform integer in [low, high]
#   ["_tune_", "loguniform", low, high]   log-uniform float
#   ["_tune_", "?uniform", default, low, high]
#                                         with probability 1/2 `default`, else uniform
# Plain values are used as they are. If you set `space`, give the whole space: it
# replaces the default, it is not merged with it. Keep ints and floats apart
# (1 vs 1.0): the sampler sees them as written.
[space.model]
n_blocks = ["_tune_", "int", 1, 4]
dropout = ["_tune_", "?uniform", 0.0, 0.0, 0.5]

[space.optimizer]
# AdamW learning rate (head weight and all biases).
lr = ["_tune_", "loguniform", 0.0001, 0.005]
# Decoupled weight decay of all weight matrices (biases: 0).
weight_decay = ["_tune_", "loguniform", 0.001, 1.0]
# Muon learning rate (backbone block weights).
muon_lr = ["_tune_", "loguniform", 0.001, 0.1]
